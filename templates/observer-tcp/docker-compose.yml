# AUS Meshcore observer (meshcore-proxy variant) — for hosts that already
# run meshcore-proxy against their radio (e.g. for the Meshcore companion
# app or Home Assistant). We attach as a second, read-only TCP client to
# the same proxy. The proxy fans incoming radio events out to all clients,
# so the existing setup is untouched.
#
# Quick start:
#   1. Make sure meshcore-proxy is running and reachable from this host.
#      If it's on the same machine, host networking or `network_mode: host`
#      is the simplest route. Otherwise change PROXY_HOST below.
#   2. docker compose up -d
#
# All config lives in this file. There's no separate config.toml.

services:
  observer:
    build: .
    container_name: aus-mesh-observer
    restart: unless-stopped
    network_mode: host        # easiest if meshcore-proxy runs on this host
    environment:
      # meshcore-proxy endpoint (default: localhost:5000 because of host networking)
      - PROXY_HOST=127.0.0.1
      - PROXY_PORT=5000

      # AUS Meshcore broker (filled in by add-observer.sh)
      - MQTT_HOST=mqtt.digitaino.com
      - MQTT_PORT=443
      - MQTT_TLS=true
      - MQTT_TRANSPORT=websockets
      - MQTT_USERNAME=__USERNAME__
      - MQTT_PASSWORD=__PASSWORD__
      - MQTT_IATA=__IATA__
