services:
  meshcore-weather:
    build: .
    container_name: meshcore-weather
    restart: unless-stopped
    volumes:
      - weather-data:/app/data
      - ./.env:/app/.env
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # Connect to radio via TCP (socat on host bridges serial)
      - MCW_SERIAL_PORT=tcp://host.docker.internal:4403
      # Use host Ollama (has GPU access, much faster than Docker Ollama)
      - MCW_OLLAMA_URL=http://host.docker.internal:11434/api/generate
      # Local MQTT broker (mosquitto), reached over the Docker network
      - MCW_MQTT_HOST=mosquitto
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # No depends_on: the bot must start (and keep running) even if MQTT or
    # CoreScope is down — MQTT publishing is fail-soft.

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      # 1883 — TCP MQTT, exposed on the host for `mosquitto_sub` debugging.
      # 9001 — MQTT-over-WebSocket. Bound to the host so the host's
      # cloudflared can forward mqtt.digitaino.com → localhost:9001 to make
      # the broker reachable to remote observers via wss://.
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./corescope/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./corescope/mosquitto/passwords:/mosquitto/config/passwords:ro
      - mosquitto-data:/mosquitto/data

  corescope:
    image: ghcr.io/kpa-clawbot/corescope:latest
    container_name: corescope
    restart: unless-stopped
    depends_on:
      - mosquitto
    ports:
      - "8082:80"      # CoreScope web UI (Caddy)
    volumes:
      - corescope-data:/app/data
      - ./corescope/config.json:/app/data/config.json:ro
      - ./corescope/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./corescope/join:/app/join:ro
    # Memory guardrails (added 2026-09-14). Without these the Go server grew to
    # ~12GB RSS for ~2.4GB of tracked data over 8 days, pushed the OrbStack VM
    # into swap, and users saw 30-120s responses and 502s. GOMEMLIMIT is a soft
    # cap that makes the GC return memory; mem_limit is the hard backstop.
    mem_limit: 10g
    environment:
      - GOMEMLIMIT=8GiB
      - NODE_ENV=production
      # Use our standalone Mosquitto (with auth) instead of the bundled one.
      - DISABLE_MOSQUITTO=true
      - DISABLE_CADDY=false

  # Signed-token observer broker. Observers authenticate by signing a token
  # with their own MeshCore Ed25519 key — no credentials are issued, and a
  # publisher can only write to meshcore/{IATA}/{its own pubkey}/*.
  #
  # Deliberately separate from `mosquitto`: the ~15 legacy observers on
  # username/password keep using mqtt.digitaino.com untouched, and this service
  # can be built, restarted and debugged without ever interrupting them.
  # CoreScope ingests both brokers as two mqttSources.
  obs-broker:
    build: ./corescope/broker
    container_name: obs-broker
    restart: unless-stopped
    ports:
      # Published on the LAN so the off-box cloudflared can forward
      # obs.digitaino.com -> http://<this-host>:8883. Plain ws:// by design;
      # Cloudflare terminates TLS at the edge.
      - "8883:8883"
    env_file:
      - ./corescope/broker/.env
    volumes:
      - obs-broker-data:/data

  # NOTE: no cloudflared service here. The host already runs cloudflared
  # natively (see ~/.cloudflared/config.yml on the iMac). To expose the
  # broker publicly, add this entry to that config and reload cloudflared:
  #
  #   - hostname: mqtt.digitaino.com
  #     service: http://localhost:9001
  #
  # Also create the DNS record:
  #   cloudflared tunnel route dns <tunnel-id> mqtt.digitaino.com
  #
  # WebSocket upgrade is auto-detected by cloudflared, no extra flag needed.

volumes:
  weather-data:
  obs-broker-data:
  corescope-data:
  mosquitto-data:
