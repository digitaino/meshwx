# AUS Meshcore observer config — generated by `scripts/add-observer.sh`.
# Placeholders below are replaced when the bundle is generated.

[[broker]]
name     = "aus-meshcore"
enabled  = true
server   = "mqtt.digitaino.com"
port     = 443
transport = "websockets"
username = "__USERNAME__"
password = "__PASSWORD__"
iata     = "__IATA__"

[broker.tls]
enabled = true

[[serial]]
ports = ["/dev/ttyUSB0"]
baud  = 115200
