# Mosquitto config for meshcore-weather + CoreScope.
# Two listeners share one password file:
#   1883/tcp   — local services on the Docker network (weatherbot, corescope)
#   9001/ws    — remote observers via Cloudflare Tunnel (mqtt-over-WebSocket)
#
# allow_anonymous false: every connection must authenticate. The password
# file is generated by `mosquitto_passwd`; see docs/Observer_Onboarding.md.

allow_anonymous false
password_file /mosquitto/config/passwords

persistence true
persistence_location /mosquitto/data/

log_dest stdout

listener 1883 0.0.0.0

listener 9001 0.0.0.0
protocol websockets
